openapi: 3.1.0

info:
  title: NYC OpenData Explorer API
  version: 1.0.0
  description: Read-only API for NYC 311 requests stored in PostgreSQL/PostGIS.

servers:
  - url: http://localhost:8080

tags:
  - name: Health
  - name: Requests

paths:
  /actuator/health:
    get:
      tags: [Health]
      summary: Spring Boot actuator health endpoint
      operationId: getActuatorHealth
      responses:
        '200':
          description: Actuator health response

  /api/311:
    get:
      tags: [Requests]
      summary: List 311 requests
      description: Returns the newest requests first, optionally filtered by time and bounding box.
      operationId: listRequests
      parameters:
        - name: limit
          in: query
          required: false
          description: Max records per page. Values are clamped to [1,100].
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: since
          in: query
          required: false
          description: Include requests where created_date >= since (ISO-8601).
          schema:
            type: string
            format: date-time
            example: "2026-02-01T00:00:00Z"
        - name: bbox
          in: query
          required: false
          description: Bounding box in minLon,minLat,maxLon,maxLat format (WGS84).
          schema:
            type: string
            example: "-74.00,40.70,-73.98,40.72"
      responses:
        '200':
          description: Request list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestsPage'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    RequestItem:
      type: object
      additionalProperties: false
      required: [service_request_number, created_date]
      properties:
        service_request_number:
          type: string
        created_date:
          type: string
          format: date-time
        closed_date:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          nullable: true
        agency:
          type: string
          nullable: true
        complaint_type:
          type: string
          nullable: true
        descriptor:
          type: string
          nullable: true
        borough:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true

    RequestsPage:
      type: object
      additionalProperties: false
      required: [items, next_token]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestItem'
        next_token:
          type: string
          nullable: true

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
